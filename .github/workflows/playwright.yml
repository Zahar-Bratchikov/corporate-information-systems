# E2E и API-тесты Playwright против поднятого docker-compose (PostgreSQL + backend + nginx).
name: Playwright

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: playwright-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and start stack
        run: docker compose up -d --build

      - name: Wait for API
        run: |
          set -e
          for i in $(seq 1 90); do
            if curl -sf http://127.0.0.1:8080/api/projects >/dev/null; then
              echo "API is up"
              exit 0
            fi
            echo "waiting for API ($i/90)..."
            sleep 2
          done
          echo "API did not become ready in time"
          docker compose logs backend
          exit 1

      - name: Wait for web (nginx + SPA)
        run: |
          set -e
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:18080/ >/dev/null; then
              echo "Frontend is up"
              exit 0
            fi
            echo "waiting for frontend ($i/60)..."
            sleep 2
          done
          echo "Frontend did not become ready in time"
          docker compose logs frontend
          exit 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright Chromium (system deps + browsers)
        working-directory: frontend
        run: npx playwright install chromium --with-deps

      - name: Run Playwright tests
        working-directory: frontend
        env:
          CI: true
          PLAYWRIGHT_SKIP_WEB_SERVER: "1"
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:18080
          API_BASE_URL: http://127.0.0.1:8080
        run: npm run test:e2e

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14

      - name: Upload test results (traces, screenshots)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: frontend/test-results/
          retention-days: 7

      - name: Print compose logs on failure
        if: failure()
        run: docker compose logs --tail 200
